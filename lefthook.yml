pre-commit:
  commands:
    lint:
      glob: '*.{js,jsx,ts,tsx,cjs,mjs}'
      run: pnpm lint:directives {staged_files} && pnpm exec oxlint --deny-warnings {staged_files}
    format:
      glob: '*.{js,jsx,ts,tsx,cjs,mjs,json,css,md,yml,yaml}'
      run: pnpm exec oxfmt --check {staged_files}
pre-push:
  commands:
    check:
      run: pnpm check
